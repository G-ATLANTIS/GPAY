name: Payment hardening

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feature/investor-grade-payment-hardening-v1

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run payment hardening tests
        run: npm test
