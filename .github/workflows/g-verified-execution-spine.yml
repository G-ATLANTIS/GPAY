name: G_VERIFIED_EXECUTION_SPINE safety

on:
  pull_request:
    paths:
      - 'backend/g-verified-execution-spine/**'
      - 'backend/g-bank-live-v1/**'
      - 'backend/routes/mollie.js'
      - 'backend/routes/pulsepay.js'
      - 'backend/routes/webhook.js'
      - 'backend/tests/g-verified-execution-spine.test.js'
      - 'backend/tests/g-bank-canonical-live-routing.test.js'
      - 'backend/tests/g-bank-live-v1.test.js'
      - 'scripts/g-verified-execution-spine.js'
      - 'scripts/g-bank-live-v1.js'
      - 'scripts/ci/check-spine-bypass.js'
      - '.github/workflows/g-verified-execution-spine.yml'
  push:
    branches:
      - 'feature/g-verified-execution-spine-p0'
      - 'feature/g-bank-canonical-live-routing-p0'

permissions:
  contents: read

jobs:
  spine-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: npm run check:spine
      - name: Static bypass guard (no live provider mutation outside the spine)
        run: npm run guard:spine-bypass
      - name: Bypass guard self-test
        run: node scripts/ci/check-spine-bypass.js --self-test
      - name: Runtime invariant self-check
        run: npm run selfcheck:spine
      - name: Spine adversarial test suite (no network, no value movement)
        run: npm run test:spine
      - name: Canonical live-routing test suite
        run: npm run test:routing
      - name: Regression - openbanking policy suite
        run: npm run test:banking
