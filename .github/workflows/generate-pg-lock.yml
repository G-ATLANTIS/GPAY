name: Generate pg lockfile

on:
  push:
    branches:
      - feature/investor-grade-payment-hardening-v1
    paths:
      - package.json
      - .github/workflows/generate-pg-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/investor-grade-payment-hardening-v1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already synchronized"
          else
            git commit -m "Lock PostgreSQL runtime dependency"
            git push origin HEAD:feature/investor-grade-payment-hardening-v1
          fi
